version: "3.9"

networks:
  ipaas:
    driver: bridge

volumes:
  kafka_data:
  artemis_data:
  nifi_data:

services:
  # -------------------------------------------------------
  # Apache ActiveMQ Artemis
  # -------------------------------------------------------
  artemis:
    image: apache/activemq-artemis:latest   # consider pinning a version
    container_name: artemis
    restart: unless-stopped

    environment:
      # ---- First-boot admin bootstrap (applied when the volume is empty) ----
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: adminadminadmin
      ARTEMIS_ROLE: admin
      # Optional: non-interactive auto-create, if image supports it
      # ANONYMOUS_LOGIN: "false"
    ports:
      - "8161:8161"     # Web console
      - "61616:61616"   # CORE / AMQP / OpenWire / MQTT / STOMP multiplexed
      - "5445:5445"     # HORNETQ/STOMP
      - "5672:5672"     # AMQP
      - "1883:1883"     # MQTT
      - "61613:61613"   # ST

    networks: [ipaas]
    volumes:
      - artemis_data:/var/lib/artemis-instance

    healthcheck:
      # Web console readiness (HTTP 200 OK on Jolokia version)
      # Uses a session-less HEAD first; if your image requires form login, use the TCP port check below instead.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8161/console/jolokia/version >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20

  # -------------------------------------------------------
  # Apache Kafka (KRaft mode, no ZooKeeper)
  # -------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.2                # consider pinning; OK to keep
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://PUBLIC_IP:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks: [ipaas]
    volumes:
      - kafka_data:/var/lib/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  # -------------------------------------------------------
  # Apache NiFi
  # -------------------------------------------------------
  nifi:
    image: apache/nifi:latest                # consider pinning a version
    container_name: nifi
    restart: unless-stopped
    environment:
      NIFI_WEB_HTTP_PORT: 8080
      NIFI_WEB_HTTPS_PORT: 8443
      NIFI_WEB_HTTPS_HOST: 0.0.0.0
      NIFI_WEB_PROXY_HOST: PUBLIC_IP:9443
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: adminadmin
    ports:
      - "9443:8443"      # # host:container  → expose HTTPS externally on 9443
    # - "8080:8080"    # optional; harmless if left, but not used in HTTPS mode
    networks: [ipaas]
    depends_on:
      kafka:
        condition: service_started
      artemis:
        condition: service_started
    volumes:
      - nifi_data:/opt/nifi/nifi-current

  # -------------------------------------------------------
  # Apache EventMesh
  # -------------------------------------------------------
  eventmesh:
    image: apache/eventmesh:latest           # consider pinning a version
    container_name: eventmesh
    restart: unless-stopped
    ports:
      - "10105:10105" # HTTP
      - "10000:10000" # TCP
      - "10205:10205" # gRPC
      - "10106:10106" # Admin
    networks: [ipaas]
    depends_on:
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:10105 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
